# gomo web app. Docker builds the image from the repository.
# To build from a local clone, set `build: .`
services:
  web:
    build: https://git.pkrm.dev/gomo.git#main:web
    image: gomo-web
    # Rebuild on each `docker compose up` to get new commits. Compose recreates
    # the container only if the image changed.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # mDNS names such as gardyn.local usually do not resolve in containers. Use the Pi's IP.
      GARDEN_URL: ${GARDEN_URL:-http://gardyn.local:5000}
      GARDEN_API_KEY: ${GARDEN_API_KEY:-}
      # The schedule runs in this time zone.
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data

volumes:
  data:
