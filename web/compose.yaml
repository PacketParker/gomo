# gomo web app. This file is all you need: Docker builds the image straight
# from the repository. Working from a clone instead? Set `build: .`
services:
  web:
    build: https://git.pkrm.dev/gomo.git#main:web
    image: gomo-web
    # Rebuild on each `docker compose up` to get new commits. Compose recreates
    # the container only if the image changed.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use the Pi's IP if gardyn.local doesn't resolve inside containers (mDNS usually doesn't).
      GARDEN_URL: ${GARDEN_URL:-http://gardyn.local:5000}
      GARDEN_API_KEY: ${GARDEN_API_KEY:-}
      # The schedule runs in this time zone.
      TZ: ${TZ:-UTC}
    volumes:
      - data:/data

volumes:
  data:
